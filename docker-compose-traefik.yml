services:
  api:
    image: ghcr.io/redthirten/vu-progression-api:main
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - proxy
      - nw
    volumes:
      - /path/to/save/logs:/usr/src/app/logs # Optional
    environment:
      NODE_ENV: "production"
      TZ: ${TZ}
      PORT: ${PORT}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      XP_MULT: ${XP_MULT}
      XP_WARN_AT: ${XP_WARN_AT}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vu-progression-secure.entrypoints=https"
      - "traefik.http.routers.vu-progression-secure.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.vu-progression-secure.tls=true"
      - "traefik.http.routers.vu-progression-secure.service=vu-progression"
      - "traefik.http.services.vu-progression.loadbalancer.server.port=${PORT}"

  db:
    # Version locked to ensure DB stability.
    # Minor updates are okay, but major updates may require `mariadb-upgrade` to be manually run.
    image: mariadb:12.1.2
    restart: unless-stopped
    networks:
      - nw
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}

volumes:
  db:

networks:
  proxy:
    external: true
  nw:
